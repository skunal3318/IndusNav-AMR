# =============================================================
# nav2_params.yaml — tuned for patrol_robot
#
# Key robot specs (from URDF):
#   base:           0.7L x 0.4W x 0.2H  (circumscribed radius ~0.404m)
#   wheel_radius:   0.1 m
#   wheel_sep:      0.38 m
#   max wheel vel:  5.0 rad/s  →  max linear = 0.5 m/s
#   max lin accel:  2.0 m/s²   (from diff-drive plugin)
#   lidar range:    0.35 – 12.0 m, 360°, 20 Hz, on lidar_link
#   frames:         base_footprint / base_link / odom / map
# =============================================================


# ---------------------------------------------------------------
# Keepout filter (unchanged — world-specific, not robot-specific)
# ---------------------------------------------------------------
# map_server_keepout:
#   ros__parameters:
#     yaml_filename: "keepout_mask.yaml"
#     topic_name: "keepout_filter_mask"
#     autostart: true
